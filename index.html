<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Verificador de Aprovação Acadêmica</title>
  
  <!-- Fonte estilo Pixel Art -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  
  <!-- Arquivo de estilo externo -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="pixel-card">
    <h1>Controle Acadêmico</h1>

    <div class="field">
      <label for="nomeAluno">Nome do Aluno:</label>
      <input type="text" id="nomeAluno" placeholder="Ex: Maria">
    </div>

    <!-- Interface das 3 notas -->
    <div class="notes-grid">
      <div>
        <label for="nota1">Nota 1:</label>
        <input type="number" id="nota1" min="0" max="10" step="0.1" placeholder="0.0">
      </div>
      <div>
        <label for="nota2">Nota 2:</label>
        <input type="number" id="nota2" min="0" max="10" step="0.1" placeholder="0.0">
      </div>
      <div>
        <label for="nota3">Nota 3:</label>
        <input type="number" id="nota3" min="0" max="10" step="0.1" placeholder="0.0">
      </div>
    </div>

    <!-- Entrada de faltas -->
    <div class="field">
      <label for="faltas">Faltas (cada = 10%):</label>
      <input type="number" id="faltas" min="0" placeholder="Ex: 2">
    </div>

    <button onclick="verificarAprovacao()">Avaliar</button>

    <div id="painelResultado" class="resultado-box"></div>
  </div>

  <!-- Arquivo de script externo -->
  <script src="script.js"></script>
</body>
</html>
